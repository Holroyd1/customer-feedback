name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 9 * * 1,4'  # Monday and Thursday at 9am UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Insert keepalive row
        run: |
          curl -X POST 'https://fibiyvxvxsktxsjyzdmh.supabase.co/rest/v1/keepalive' \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{}'

      - name: Clean up old keepalive rows
        run: |
          curl -X DELETE 'https://fibiyvxvxsktxsjyzdmh.supabase.co/rest/v1/keepalive?pinged_at=lt.now()' \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
